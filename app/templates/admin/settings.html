{% extends "admin/base.html" %}
{% block title %}Settings{% endblock %}
{% block header %}Site Settings{% endblock %}
{% block content %}
<div class="panel">
    <div class="panel-heading">
        <h2>Site Identity</h2>
    </div>
    
    <form method="post" class="form-grid">
        <div class="form-section two-column">
            <label>Site Name
                <input name="site_name" value="{{ settings.get('site_name', '') }}" required>
            </label>
            <label>Logo URL
                <input name="logo_url" value="{{ settings.get('logo_url', '') }}">
            </label>
        </div>
        
        <div class="form-section full-span">
            <label>Description
                <textarea name="site_description" rows="4">{{ settings.get('site_description', '') }}</textarea>
            </label>
        </div>
        
        <h3 style="font-size: 14px; color: var(--text-secondary); margin: 15px 0 5px; text-transform: uppercase; letter-spacing: 0.5px;">Social Links</h3>
        
        <div class="form-section two-column">
            <label>Twitter URL
                <input name="twitter_url" value="{{ settings.get('twitter_url', '') }}">
            </label>
            <label>GitHub URL
                <input name="github_url" value="{{ settings.get('github_url', '') }}">
            </label>
            <label>LinkedIn URL
                <input name="linkedin_url" value="{{ settings.get('linkedin_url', '') }}">
            </label>
        </div>
        
        <div class="full-span" style="margin-top: 15px;">
            <button class="button save-button" style="padding: 12px 24px; font-size: 14px;"><i data-lucide="save"></i> Save Settings</button>
        </div>
    </form>
</div>
{% endblock %}
